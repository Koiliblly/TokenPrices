[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenprices"
version = "1.0.0"
description = "LLM API price board for your terminal: live per-million-token prices for 465+ models, compare, cost calculator, HTML report. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Koiliblly" }]
keywords = ["llm", "api", "pricing", "cost", "openrouter", "deepseek", "claude", "gpt", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Koiliblly/TokenPrices"
Repository = "https://github.com/Koiliblly/TokenPrices"

[project.scripts]
tokenprices = "tokenprices:main"

[tool.setuptools]
py-modules = ["tokenprices"]
